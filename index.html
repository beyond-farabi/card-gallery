<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>fact gallery</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&display=swap" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header><h1>Fact Gallery</h1></header>

    <div class="controls">
        <input type="search" id="search" placeholder="Cari fakta..." aria-label="Cari fakta">

        <div class="filters" id="filters">
            <button type="button" data-category="all" class="active">Semua</button>

            <!-- sisanya akan dibuat oleh js -->
             
        </div>
    </div>

    <main>
        <!-- ini hanya wadah kosong, karena semua kartu akan dibuat oleh js -->
        <div class="gallery" id="gallery"></div>
    </main>

    <dialog id="modal">
        <button type="button" class="modal-close" aria-label="Tutup">&times;</button>
        <div id="modal-content"></div>
    </dialog>

    <script src="script.js"></script>

</body>
</html>
